services:
  minerva-pgsql:
    image: postgres
    container_name: minerva-pgsql
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    ports:
      - 5432:5432
    networks:
      - minerva-network

  minerva-api:
    image: vedph2020/minerva-api:1.1.2
    container_name: minerva-api
    ports:
        - 5180:8080
    depends_on:
        - minerva-pgsql
    environment:
        - ASPNETCORE_URLS=http://+:8080
        - CONNECTIONSTRINGS__DEFAULT=User ID=postgres;Password=postgres;Host=minerva-pgsql;Port=5432;Database={0};
        # - ALLOWEDORIGINS__0=http://www.something.com
        - SEEDDELAY=30
        - MESSAGING__APIROOTURL=https://minerva.it/api/
        - MESSAGING__APPROOTURL=https://minerva.it/
        - MESSAGING__SUPPORTEMAIL=attichiari@unige.it
    networks:
        - minerva-network

networks:
  minerva-network:
    driver: bridge
